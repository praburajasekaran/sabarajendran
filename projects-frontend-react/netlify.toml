[build]
  command = "npm run build"
  publish = "dist"

# MAINTENANCE MODE - Redirect all traffic to maintenance page
# To restore: remove the first [[redirects]] block and uncomment the second one
[[redirects]]
  from = "/*"
  to = "/maintenance.html"
  status = 503
  force = true

# ORIGINAL REDIRECT - Uncomment when restoring site
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200

# Only set cache headers, let Netlify handle Content-Type automatically
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

