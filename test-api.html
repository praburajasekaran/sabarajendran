<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>WordPress API Test</h1>
    <button onclick="testAPI()">Test API</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const apiUrl = 'http://localhost:8888/sabarajendran/index.php?rest_route=/wp/v2/project&per_page=5';
            const resultDiv = document.getElementById('result');

            resultDiv.innerHTML = 'Testing API: ' + apiUrl + '<br>Loading...';

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                resultDiv.innerHTML = `
                    <h2>Success!</h2>
                    <p>Status: ${response.status}</p>
                    <p>Projects found: ${data.length}</p>
                    <pre>${JSON.stringify(data[0], null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <h2>Error!</h2>
                    <p>${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
