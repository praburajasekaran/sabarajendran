<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MLA Saba Rajendran | Neyveli Constituency Projects</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Resource hints for faster loading -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://aistudiocdn.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
  <link rel="dns-prefetch" href="https://aistudiocdn.com">

  <!-- Google Fonts: Lora (serif) and IBM Plex Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            // Headlines: Elegant serif
            serif: ['Lora', 'Georgia', 'serif'],
            // Body: Clean sans-serif
            sans: ['Inter', 'system-ui', 'sans-serif'],
            // Data/Numbers: Mono for alignment
            mono: ['IBM Plex Mono', 'Courier New', 'monospace'],
          },
          fontSize: {
            // Display (Hero headlines)
            'display-lg': ['4rem', { lineHeight: '1', letterSpacing: '-0.02em' }],
            'display-md': ['3rem', { lineHeight: '1.1', letterSpacing: '-0.02em' }],
            // Headings
            'h1': ['2.5rem', { lineHeight: '1.2', letterSpacing: '-0.01em' }],
            'h2': ['2rem', { lineHeight: '1.25', letterSpacing: '-0.01em' }],
            'h3': ['1.5rem', { lineHeight: '1.33', letterSpacing: '0' }],
            // Body
            'body-lg': ['1.125rem', { lineHeight: '1.75' }],
            'body': ['1rem', { lineHeight: '1.75' }],
            'body-sm': ['0.875rem', { lineHeight: '1.6' }],
            // Data (mono)
            'data-lg': ['2rem', { lineHeight: '1' }],
            'data': ['1.25rem', { lineHeight: '1.2' }],
          },
          colors: {
            // Primary: Terracotta (replaces harsh red)
            primary: {
              50: '#fef7f4',
              100: '#fdeee7',
              200: '#fad9c9',
              300: '#f7bfa5',
              400: '#f39667',
              500: '#e96e37', // Main terracotta
              600: '#d55220',
              700: '#b33f18',
              800: '#8f331a',
              900: '#742c18',
            },
            // Secondary: Rice Paddy Green (fresh, growth)
            secondary: {
              50: '#f3f8f3',
              100: '#e4f0e3',
              200: '#cae1c8',
              300: '#a3caa0',
              400: '#74ad71',
              500: '#528f4e', // Main green
              600: '#3f7039',
              700: '#345a2f',
              800: '#2c4827',
              900: '#253c22',
            },
            // Accent: Clay Earth (warm neutral)
            accent: {
              50: '#f9f7f4',
              100: '#f0ede6',
              200: '#e0d8ca',
              300: '#cdbfaa',
              400: '#b59f84',
              500: '#9d8468', // Main clay
              600: '#8a6e58',
              700: '#73594a',
              800: '#5e4a40',
              900: '#4d3d35',
            },
            // Neutral: Warm stone (not cold gray)
            neutral: {
              50: '#fafaf9',
              100: '#f5f5f4',
              200: '#e7e5e4',
              300: '#d6d3d1',
              400: '#a8a29e',
              500: '#78716c',
              600: '#57534e',
              700: '#44403c',
              800: '#292524',
              900: '#1c1917',
            },
            // Legacy DMK colors (for backwards compatibility)
            dmk: {
              black: '#000000',
              red: '#dc2626'
            }
          }
        },
      },
    }
  </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-stone-50 text-stone-900 antialiased">
  <div id="root">
    <!-- Initial loading state - shows while React loads -->
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(to bottom right, #1c1917, #292524, #1c1917);">
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .loader-spin { animation: spin 1s linear infinite; }
        .loader-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      </style>
      <div class="loader-spin" style="width: 48px; height: 48px; border: 4px solid rgba(220, 38, 38, 0.2); border-top-color: #dc2626; border-radius: 50%; margin-bottom: 16px;"></div>
      <div class="loader-pulse" style="color: white; font-size: 18px; font-weight: 600;">Loading MLA Portal...</div>
    </div>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
