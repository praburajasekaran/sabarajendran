<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MLA Saba Rajendran | Neyveli Constituency Projects</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Resource hints for faster loading -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://aistudiocdn.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
  <link rel="dns-prefetch" href="https://aistudiocdn.com">

  <!-- Google Fonts: Lora (serif) and IBM Plex Mono -->
  <link
    href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Anek+Tamil:wght@100..800&family=Anek+Latin:wght@100..800&family=Baloo+2:wght@400..800&family=Baloo+Thambi+2:wght@400..800&display=swap&v=1"
    rel="stylesheet">
  <style>
    /* Force font families to ensure they are applied */
    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    .font-sans,
    .font-display {
      font-family: 'Anek Tamil', 'IBM Plex Mono', sans-serif !important;
    }

    body {
      font-family: 'Anek Tamil', sans-serif !important;
    }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            // Headlines: Bold, Impactful
            sans: ['Anek Tamil', 'sans-serif'],
            display: ['Anek Tamil', 'sans-serif'],
            serif: ['Anek Tamil', 'sans-serif'], // Force serif to sans for political consistency
            // Data/Numbers: Mono for alignment
            mono: ['IBM Plex Mono', 'Courier New', 'monospace'],
          },
          fontSize: {
            // Display (Hero headlines)
            'display-lg': ['4.5rem', { lineHeight: '0.9', letterSpacing: '-0.02em', fontWeight: '800' }],
            'display-md': ['3.5rem', { lineHeight: '1', letterSpacing: '-0.02em', fontWeight: '800' }],
            // Headings
            'h1': ['3rem', { lineHeight: '1.1', letterSpacing: '-0.01em', fontWeight: '700' }],
            'h2': ['2.25rem', { lineHeight: '1.2', letterSpacing: '-0.01em', fontWeight: '700' }],
            'h3': ['1.75rem', { lineHeight: '1.25', letterSpacing: '0', fontWeight: '600' }],
            // Body
            'body-lg': ['1.25rem', { lineHeight: '1.6', fontWeight: '500' }],
            'body': ['1.125rem', { lineHeight: '1.6', fontWeight: '400' }],
            'body-sm': ['1rem', { lineHeight: '1.5' }],
            // Data (mono)
            'data-lg': ['2.5rem', { lineHeight: '1', fontWeight: '700' }],
            'data': ['1.5rem', { lineHeight: '1.2' }],
          },
          colors: {
            // Primary: DMK Red (Energetic, Powerful)
            primary: {
              50: '#fef2f2',
              100: '#fee2e2',
              200: '#fecaca',
              300: '#fca5a5',
              400: '#f87171',
              500: '#dc2626', // Base Red
              600: '#b91c1c',
              700: '#991b1b', // Darker Red for text/contrast
              800: '#7f1d1d',
              900: '#450a0a',
            },
            // Secondary: Black (Solid, Grounding)
            secondary: {
              50: '#f6f6f6',
              100: '#e7e7e7',
              200: '#d1d1d1',
              300: '#b0b0b0',
              400: '#888888',
              500: '#6d6d6d',
              600: '#5d5d5d',
              700: '#4f4f4f',
              800: '#262626', // Off Black
              900: '#000000', // Pure Black
            },
            // Accent: DMK Yellow (Bright, Attention)
            accent: {
              50: '#fffbeb',
              100: '#fef3c7',
              200: '#fde68a',
              300: '#fcd34d',
              400: '#fbbf24', // Base Yellow
              500: '#f59e0b',
              600: '#d97706',
              700: '#b45309',
              800: '#92400e',
              900: '#78350f',
            },
            // Neutral: Cool Grays to support the warm palette
            neutral: {
              50: '#f9fafb',
              100: '#f3f4f6',
              200: '#e5e7eb',
              300: '#d1d5db',
              400: '#9ca3af',
              500: '#6b7280',
              600: '#4b5563',
              700: '#374151',
              800: '#1f2937',
              900: '#111827',
            }
          }
        },
      },
    }
  </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-stone-50 text-stone-900 antialiased">
  <div id="root">
    <!-- Initial loading state - shows while React loads -->
    <div
      style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(to bottom right, #1c1917, #292524, #1c1917);">
      <style>
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }

        @keyframes pulse {

          0%,
          100% {
            opacity: 1;
          }

          50% {
            opacity: 0.5;
          }
        }

        .loader-spin {
          animation: spin 1s linear infinite;
        }

        .loader-pulse {
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
      </style>
      <div class="loader-spin"
        style="width: 48px; height: 48px; border: 4px solid rgba(220, 38, 38, 0.2); border-top-color: #dc2626; border-radius: 50%; margin-bottom: 16px;">
      </div>
      <div class="loader-pulse" style="color: white; font-size: 18px; font-weight: 600;">Loading MLA Portal...</div>
    </div>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
