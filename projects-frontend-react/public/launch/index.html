<!DOCTYPE html>
<html>

<head>
    <title>Website Grand Opening</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #000;
        }

        /* First Screen */
        #opening {
            position: fixed;
            inset: 0;
            background: url("opening.jpeg") no-repeat center center;
            background-size: cover;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: transform 1.2s ease-in-out;
            z-index: 5;
        }

        #opening.hide {
            transform: translateY(-100%);
        }

        /* Second Screen */
        #sunrise {
            position: fixed;
            inset: 0;
            background: url("sunrise.jpg") no-repeat center center;
            background-size: cover;
            transform: scale(1.3);
            opacity: 0;
            transition: all 2.5s ease-in-out;
            z-index: 1;
        }

        #sunrise.show {
            transform: scale(1);
            opacity: 1;
        }

        /* Premium Golden Button */
        #openBtn,
        #welcomeBtn {
            border-radius: 70px;
            border: none;
            cursor: pointer;
            color: #5a3b00;
            background: linear-gradient(45deg, #FFD700, #FFB700, #FFD700);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
            animation: pulse 1.5s infinite;
            position: relative;
            overflow: hidden;
        }

        /* First button */
        #openBtn {
            font-size: 34px;
            padding: 20px 50px;
        }

        /* Second button - CENTER */
        #welcomeBtn {
            font-size: 26px;
            padding: 14px 35px;
            position: absolute;
            top: 85%;
            left: 35%;
            right: 35%;
            transform: translate(-50%, -50%);
            display: none;
        }

        /* Glow ripple */
        #openBtn:after,
        #welcomeBtn:after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 70px;
            animation: ripple 1.5s infinite;
            border: 2px solid rgba(255, 255, 255, 0.9);
        }

        #openBtn:hover {
            transform: scale(1.05);
        }

        #welcomeBtn:hover {
            transform: translate(-50%, -50%) scale(1.05);
        }

        /* Animations */
        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes ripple {
            0% {
                opacity: 1;
            }

            100% {
                transform: scale(1.6);
                opacity: 0;
            }
        }

        /* 🌹Flower falling animation */
        .flower {
            position: fixed;
            top: -50px;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 10;
        }

        @keyframes fall {
            from {
                transform: translateY(-50px) rotate(0deg);
                opacity: 1;
            }

            to {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0.9;
            }
        }
    </style>
</head>

<body>

    <!-- Audio -->
    <audio id="magicSound" src="magic.mp3"></audio>
    <audio id="clapSound" src="clap.mp3"></audio>
    <audio id="tamilVoice" src="welcome_tamil.mp3"></audio>

    <!-- 🌅 Second Screen -->
    <div id="sunrise">
        <button id="welcomeBtn" onclick="goWebsite()">🌞 Welcome to Website</button>
    </div>

    <!-- 🎉 First Screen -->
    <div id="opening">
        <h1>Website Grand Opening</h1>
        <button id="openBtn" onclick="openSite()">🌟 இணையதளம் திறக்க</button>
    </div>

    <script>
        function openSite() {

            // Magic Sound
            document.getElementById("magicSound").play();

            // Slide up opening screen
            document.getElementById("opening").classList.add("hide");

            // Show sunrise screen
            document.getElementById("sunrise").classList.add("show");

            // Tamil welcome voice + show button
            setTimeout(() => {
                document.getElementById("tamilVoice").play();
                document.getElementById("welcomeBtn").style.display = "block";
            }, 2500);
        }

        /* 🌹Create lots of falling flowers */
        function createFlowers() {
            for (let i = 0; i < 100; i++) { // 🌼 More flowers
                const flower = document.createElement("div");
                flower.className = "flower";
                flower.innerHTML = "🌹";

                flower.style.left = Math.random() * window.innerWidth + "px";
                flower.style.animationDuration = (4 + Math.random() * 4) + "s";
                flower.style.fontSize = (22 + Math.random() * 26) + "px";

                document.body.appendChild(flower);

                setTimeout(() => {
                    flower.remove();
                }, 9000);
            }
        }

        function goWebsite() {

            // 🌹 Flower animation
            createFlowers();

            var clap = document.getElementById("clapSound");
            clap.volume = 1;
            clap.play();

            // 🔉 Fade out clap sound in 3 seconds
            let fadeSteps = 30;
            let stepTime = 100; // 30 x 100ms = 3000ms
            let volumeStep = clap.volume / fadeSteps;

            let fade = setInterval(() => {
                if (clap.volume > volumeStep) {
                    clap.volume -= volumeStep;
                } else {
                    clap.volume = 0;
                    clap.pause();
                    clearInterval(fade);
                }
            }, stepTime);

            // ⏳ Redirect after animation
            setTimeout(() => {
                window.location.href = "https://sabarajendran.com/";
            }, 4500);
        }
    </script>

</body>

</html>
