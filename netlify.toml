[build]
  base = "projects-frontend-react"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_WP_API_URL = "https://tan-emu-358425.hostingersite.com/wp-json/wp/v2"
  VITE_SITE_URL = "https://sabarajendran.com"
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache busting for API responses
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
